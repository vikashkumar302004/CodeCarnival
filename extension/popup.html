<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCarnival</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">CC</div>
        <div><h1>CodeCarnival</h1><p>Make every solve feel legendary.</p></div>
        <label class="switch" title="Enable CodeCarnival">
          <input id="enabled" type="checkbox" checked />
          <span></span>
        </label>
      </header>

      <section>
        <div class="section-title"><h2>Choose your world</h2><span id="theme-count">6 themes</span></div>
        <div id="theme-grid" class="theme-grid"></div>
      </section>

      <section class="customizer">
        <div class="section-title"><h2>Make it yours</h2><button id="reset" class="text-button">Reset</button></div>
        <label class="upload-zone" for="background-file">
          <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          <span class="upload-icon">↑</span>
          <span><strong>Drop your picture</strong><small>PNG, JPG, WEBP or GIF</small></span>
        </label>
        <div class="controls">
          <label>Accent <input id="accent" type="color" value="#f8c451" /></label>
          <label>Blur <input id="blur" type="range" min="0" max="20" value="8" /></label>
          <label>Shade <input id="overlay" type="range" min="10" max="90" value="55" /></label>
        </div>
      </section>

      <section class="celebration-row">
        <label><input id="sound" type="checkbox" checked /> Celebration sound</label>
        <button id="preview" class="primary-button">Preview celebration</button>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script src="themes.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
